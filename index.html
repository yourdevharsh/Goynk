<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="/src/scripts/main.js" defer></script>
  </head>

  <body>
    <header>
      <h1 id="heading">Goynk</h1>
    </header>
    <main class="container">
      <form class="row"></form>
      <div id="settings">
        <label for="blinkMode">Choose mode:</label>
        <select name="blinkMode" id="blinkMode" class="selectBox">
          <option value="idealMode" class="oneOption">Ideal</option>
          <option value="healthyMode" class="oneOption">Healthy</option>
          <option value="minimumMode" class="oneOption">Minimum</option>
        </select>

        <label for="blinkTime">Choose time:</label>
        <select
          name="blinkTime"
          id="blinkTime"
          class="selectBox"
          title="Select 'Ideal Mode' to enable this option."
        >
          <option value="threeSec" class="oneOption" title="Best Option">
            3s
          </option>
          <option value="fourSec" class="oneOption">4s</option>
          <option value="fiveSec" class="oneOption">5s</option>
        </select>

        <label for="blinkWay">Choose overlay:</label>
        <select name="blinkWay" id="blinkWay" class="selectBox">
          <option value="threeSec" class="oneOption">Black Overlay</option>
          <option value="fourSec" class="oneOption">Text Popup</option>
          <option value="fiveSec" class="oneOption">Simple Sound</option>
        </select>

        <label for="blinkSound">Choose sound:</label>
        <select name="soundStatus" id="soundStatus" class="selectBox">
          <option value="enabled" class="oneOption">Enabled</option>
          <option value="disabled" class="oneOption">Disabled</option>
        </select>
      </div>
        <button type="submit" id="submitBtn">Start</button>
      </form>
    </main>

    <footer>
      <p>@yourdevharsh</p>
    </footer>
  </body>
</html>
